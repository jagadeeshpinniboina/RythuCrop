<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- High-Contrast Emerald Background Gradient -->
    <linearGradient id="emblemBg" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Outer Precision Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Golden Crop Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Tech Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-Contrast Circular Base -->
  <circle cx="50" cy="50" r="48" fill="url(#emblemBg)" />

  <!-- Outer Tech Orbit / Accent Ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.9" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#34d399" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />

  <!-- AI Precision Nodes on Orbit -->
  <circle cx="50" cy="3" r="2.5" fill="#6ee7b7" filter="url(#softGlow)" />
  <circle cx="97" cy="50" r="2" fill="#6ee7b7" opacity="0.9" />
  <circle cx="50" cy="97" r="2.5" fill="#6ee7b7" filter="url(#softGlow)" />
  <circle cx="3" cy="50" r="2" fill="#6ee7b7" opacity="0.9" />
  <circle cx="83.2" cy="16.8" r="1.8" fill="#facc15" />
  <circle cx="16.8" cy="83.2" r="1.8" fill="#facc15" />

  <!-- Central Emblem: Sprout & Crop Harmony -->
  <!-- Left Sprout Leaf (Nature & Soil) -->
  <path d="M 50 79 C 41 67 29 58 29 42 C 29 27 42 21 50 35 C 47 46 45 58 50 79 Z" fill="url(#leafGrad)" />
  <path d="M 50 35 C 44 46 40 56 41 67" fill="none" stroke="#dcfce7" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

  <!-- Right Wheat Stalk / Grain Ear (Yield & Harvest) -->
  <path d="M 50 79 C 54 67 66 58 66 42 C 66 27 53 21 50 35 C 54 46 56 58 50 79 Z" fill="url(#goldGrad)" />
  <!-- Grain Pod Details -->
  <path d="M 53 37 Q 64 34 67 41 Q 63 47 54 43 Z" fill="#fef08a" />
  <path d="M 54 47 Q 67 45 69 52 Q 63 59 54 54 Z" fill="#facc15" />
  <path d="M 53 57 Q 64 57 65 63 Q 60 69 52 64 Z" fill="#eab308" />

  <!-- Central Stem & AI Neural Circuit Pathway -->
  <path d="M 50 83 L 50 29" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- AI Neural Intersections -->
  <line x1="50" y1="50" x2="37" y2="43" stroke="#86efac" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="37" cy="43" r="2.2" fill="#86efac" filter="url(#softGlow)" />

  <line x1="50" y1="61" x2="63" y2="55" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="63" cy="55" r="2.2" fill="#fef08a" filter="url(#softGlow)" />

  <line x1="50" y1="40" x2="41" y2="33" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="41" cy="33" r="1.8" fill="#a7f3d0" />

  <line x1="50" y1="45" x2="59" y2="38" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="59" cy="38" r="1.8" fill="#fde047" />

  <!-- Core Apex Star / Precision Beacon -->
  <circle cx="50" cy="26" r="3.4" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="50" cy="26" r="2" fill="#34d399" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
  <circle cx="50" cy="50" r="1.7" fill="#047857" />
  <circle cx="50" cy="81" r="2.6" fill="#34d399" />
</svg>
